# Dashboards!

# Two approaches to dashboards in R

| | **flexdashboard** (R Markdown) | **Quarto Dashboards** |
|---|---|---|
| Format | `.Rmd` | `.qmd` |
| Available since | 2016 | Quarto v1.4 (2024) |
| Layout syntax | Markdown headers + `{data-width}` | Markdown headers + YAML attributes |
| Interactivity | `runtime: shiny` | `server: shiny` |
| Theming | Bootstrap themes, custom CSS | `_brand.yml`, Bootstrap, CSS |
| Value boxes | `flexdashboard::valueBox()` | Native chunk option `#&amp;#124; content: valuebox` |
| Status | Stable, maintained | Actively developed |

--

We'll cover **both** — flexdashboard first (since we're in R Markdown land), then the Quarto way.

# Step 2: Look at the default YAML

When you create a new flexdashboard from the template, you get this:

```yaml
---
title: "My Dashboard"
output: 
  flexdashboard::flex_dashboard:
    orientation: columns
    vertical_layout: fill
---
```

--

Two key YAML options to know right away:

* **`orientation`**: `columns` (default) or `rows` — controls how content is laid out
* **`vertical_layout`**: `fill` (stretch to fit) or `scroll` (allow scrolling)

---
# Step 3: Knit right away!

Before adding anything, **knit the template** so you know what the default looks like.

--

You should see a page with placeholder content split into two columns.

--

Now let's understand *why* it looks the way it does...

---
# Understanding the layout model

flexdashboard uses **markdown headers** to define structure:

| Header Level | What it creates |
|---|---|
| `# Page Title` | A new **page** (tab in the nav bar) |
| `Column` or `Row` (with dashes) | A new **column** or **row** |
| `### Box Title` | A new **card/box** within the column/row |

--

Think of it as nesting: **Pages &gt; Columns/Rows &gt; Boxes**

---
# Columns

* Define new column with 

```
Column
----------------------------------
```

* Optionally specify the width with `{data-width}`

--
* Annoyingly, be careful with spacing! 

`{data-width=650}` will work

### but 

`{data-width = 650}` will not work


---
# Step 4: A two-column layout

Here's the pattern you'll use most often:

```md
Column {data-width=650}
----------------------------
### Chart A
&lt; r code chunk &gt;

Column {data-width=350}
----------------------------
### Chart B
&lt; r code chunk &gt;

### Chart C
&lt; r code chunk &gt;
```

--

* The left column gets 65% of the width, with one chart
* The right column gets 35%, split evenly between two charts

---
# New boxes


``` md
### Box title
&lt; r code chunk &gt;
```

* Each time you add a box it will split the area evenly among all the boxes in that column

---
# Thinking in rows

* Change the YAML to 

```md
output: 
  flexdashboard::flex_dashboard:
    orientation: rows
```

--

* Now `###` will create a new column *within* a row


--
* Add new rows with

```md
Row
----------------------------------
```

--
* Modify height with `{data-height=XXX}`


---
# Step 5: Add a second page

You can easily specify multiple pages by just specifying a Level 1 Header

```md
# Page 1

Column {data-width=650}
----------------------------
### Chart A
&lt; r code&gt;

Column {data-width=350}
----------------------------
### Chart B
&lt; r code&gt;

### Chart C
&lt; r code&gt;

# Page 2

```

# Step 6: Make it interactive with tabsets

This is actually a standard R Markdown feature, but you can use it with flexdashboards as well


```md

### Data Table
&lt; r code&gt;
```

# Deploying flexdashboard to GitHub Pages

Since flexdashboard knits to a **single HTML file** (self-contained by default), deployment is simple:

--

**Option 1: Manual (quick and dirty)**

1. Knit your `.Rmd` → produces a `.html` file
2. Rename it to `index.html`
3. Push to a GitHub repo
4. Go to *Settings &gt; Pages* → set source to the branch/folder containing `index.html`

---
# Deploying flexdashboard to GitHub Pages

**Option 2: `docs/` folder (cleaner)**

1. Add `knit_dir` or just save/move your `.html` into a `docs/` folder
2. Push to GitHub
3. In *Settings &gt; Pages*, set source to **`/docs`** on your main branch

---
# Deploying flexdashboard to GitHub Pages

**Option 3: GitHub Actions (automated)**

* Use a workflow that runs `rmarkdown::render()` and deploys the output
* More setup, but re-renders automatically on every push

--
No special server needed — it's just an HTML file!

# Part 2: Quarto Dashboards
### The modern approach (Quarto ≥ 1.4)

---
# Why Quarto Dashboards?

flexdashboard is great, and it's not going anywhere. But Quarto Dashboards offer some compelling advantages:

--

* **Multi-language**: Works with R, Python, Julia, and Observable

--

* **Native value boxes**: No package function needed — just a chunk option

--

* **`_brand.yml` theming** (new in Quarto 1.6+): Define colors, fonts, and logos in one YAML file and apply across all your Quarto outputs

--

* **Light/dark mode toggle** (Quarto 1.7+): Built-in, automatic

--

* **Accessibility checks** (Quarto 1.8): Axe-core engine built in

--

* **No special package to install** — it's a native Quarto format

---
# The simplest Quarto dashboard

Create a `.qmd` file with this YAML:

```yaml
---
title: "My Dashboard"
format: dashboard
---
```

That's it. Every code chunk becomes a **card**.

--

Compare to flexdashboard, where you need:

```yaml
output: 
  flexdashboard::flex_dashboard:
    orientation: columns
    vertical_layout: fill
```

---
# Layout: Same mental model, cleaner syntax

The mapping from flexdashboard → Quarto:

| flexdashboard | Quarto Dashboard |
|---|---|
| `# Page Title` | `# Page Title` |
| `Column {data-width=650}` | `## Column {width=650}` |
| `### Chart Title` | Code chunk with `#&amp;#124; title: "Chart Title"` |
| `{data-height=400}` | `{height=400}` |

--

Key difference: Quarto uses `##` for rows/columns (not the dashed line convention)

---
# A Quarto dashboard layout

```md
---
title: "My Dashboard"
format: dashboard
---

## Row {height=70%}

`​``{r}
#| title: "Main Chart"
ggplot(mtcars, aes(wt, mpg)) + geom_point()
`​``

## Row {height=30%}

`​``{r}
#| title: "Table"
knitr::kable(head(mtcars))
`​``

`​``{r}
#| title: "Summary"
summary(mtcars$mpg)
`​``
```

---
# Value Boxes

One of the best features of Quarto Dashboards — **native value boxes**

In flexdashboard, you'd write:

```r
flexdashboard::valueBox(42, caption = "Articles", icon = "fa-file")
```

--

In Quarto, you use chunk options:

```md
`​``{r}
#| content: valuebox
#| title: "Total Articles"
#| icon: file-text
#| color: primary
list(value = 42)
`​``
```

--

Or even **pure markdown** (no code at all!):

```md
::: {.valuebox icon="file-text" color="primary"}
Total Articles

42
:::
```

---
# Value box colors

Quarto value boxes support semantic colors that adapt to your theme:

| Color | Meaning |
|---|---|
| `primary` | Main brand color |
| `secondary` | Subdued |
| `success` | Green — something good |
| `info` | Blue — informational |
| `warning` | Yellow/orange — caution |
| `danger` | Red — alert |
| `light` / `dark` | Light or dark backgrounds |

--

You can also use any hex color: `color: "#6C4675"`

---
# Value boxes: a full example row

```md
## Row {height="25%"}

`​``{r}
#| label: calculate-values
n_schools &lt;- nrow(school_data)
avg_score &lt;- round(mean(school_data$score), 1)
pct_proficient &lt;- paste0(round(mean(school_data$proficient) * 100), "%")
`​``

`​``{r}
#| content: valuebox
#| title: "Schools in Sample"
#| icon: building
#| color: primary
list(value = n_schools)
`​``

`​``{r}
#| content: valuebox
#| title: "Avg. Score"
#| icon: bar-chart
#| color: info
list(value = avg_score)
`​``

`​``{r}
#| content: valuebox
#| title: "Proficient"
#| icon: check-circle
#| color: success
list(value = pct_proficient)
`​``
```

# Theming with`_brand.yml`

New in **Quarto 1.6** and enhanced in **1.7–1.8**, `_brand.yml` lets you define your visual identity in one place.
---
# Theming with`_brand.yml`

Create a `_brand.yml` file in your project root:

```yaml
color:
  palette:
    uoregon-green: "#154733"
    uoregon-yellow: "#FEE123"
  foreground: "#333333"
  background: "#FFFFFF"
  primary: "#154733"

typography:
  base:
    family: "Source Sans Pro"
  headings:
    family: "Source Serif Pro"
    weight: 600

logo:
  medium: logo.png
```

--

Quarto automatically picks this up — no extra YAML needed in your `.qmd`!

---
# Light/Dark mode (Quarto 1.7+)

Provide a light and dark theme and Quarto adds a **toggle automatically**:

```yaml
---
title: "My Dashboard"
format:
  dashboard:
    theme:
      light: flatly
      dark: darkly
---
```

--

Or with `_brand.yml` (Quarto 1.8+):

```yaml
# _brand.yml
color:
  foreground:
    light: "#333333"
    dark: "#EEEEEE"
  background:
    light: "#FFFFFF"
    dark: "#1a1a2e"
logo:
  medium:
    light: logo.png
    dark: logo-white.png
```

---
# Accessibility checks (Quarto 1.8)

Add the `axe` option to your dashboard to run automated accessibility checks:

```yaml
---
title: "My Dashboard"
format:
  dashboard:
    axe: true
---
```

--

When you render, Quarto will show warnings directly in the preview if there are accessibility violations (missing alt text, color contrast issues, etc.)

--

This is especially useful for **education policy dashboards** that need to be accessible to broad audiences.

---
# Quick theming with Bootstrap

Just like flexdashboard, Quarto dashboards support Bootswatch themes:

```yaml
format:
  dashboard:
    theme: cosmo
```

Available themes: `cosmo`, `flatly`, `journal`, `lumen`, `minty`, `pulse`, `sandstone`, `simplex`, `united`, `yeti`, and more.

--

You can layer a custom SCSS file on top:

```yaml
format:
  dashboard:
    theme: [flatly, custom.scss]
```

# Deploying Quarto dashboards

Because Quarto dashboards render to **static HTML** by default:

* **Same: Just like flexdashboard - rename index.html and  push
* **GitHub Pages**: `quarto publish gh-pages`
* **Netlify**: Drag and drop the `_site/` folder, or connect to your repo
* **Posit Connect / Connect Cloud**: `quarto publish connect`

--

We will discuss other deployments next week!

---
# flexdashboard → Quarto: migration cheatsheet

| flexdashboard | Quarto Dashboard |
|---|---|
| `output: flexdashboard::flex_dashboard:` | `format: dashboard` |
| `orientation: rows` | `orientation: rows` (same!) |
| `Column {data-width=650}` | `## Column {width=650}` |
| `### Chart Title` | `#&amp;#124; title: "Chart Title"` |
| `{.tabset}` | `{.tabset}` (same!) |
| `runtime: shiny` | `server: shiny` |
| `flexdashboard::valueBox()` | `#&amp;#124; content: valuebox` |
| `css: custom.css` | `theme: [default, custom.scss]` |
| Bootstrap themes | Bootstrap themes + `_brand.yml` |

---
# Summary

### flexdashboard
* Mature, stable, great for R-only projects
* Rich ecosystem of examples and documentation
* If you're already comfortable with R Markdown, it's easy

### Quarto Dashboards
* The future — actively developed with new features every release
* Multi-language support (R, Python, Julia)
* Native value boxes, `_brand.yml` branding, light/dark mode, accessibility checks
* Better if you're already using Quarto for other things

--

**My recommendation**: Learn both layouts (they're very similar!), stick to the one you are comfortable with.
