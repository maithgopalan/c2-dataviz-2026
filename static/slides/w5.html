# Comparing Categories: Core Concepts

---
# Why Compare Categories?

* Categories are everywhere in data
  + Demographics (race, gender, education level)
  + Geographic units (states, countries, regions)
  + Time periods (years, quarters, months)
  + Experimental conditions or groups

--

* Key questions when comparing categories:
  + Which category has the highest/lowest value?
  + How different are the categories from each other?
  + Are there patterns or trends across categories?
  + How do distributions differ across categories?

---
# Strategies for Comparing Categories

1. **Direct comparison**: Bar charts, dot plots, lollipop charts

2. **Showing distributions**: Boxplots, violin plots, ridgeline plots

3. **Multiple dimensions**: Faceting, small multiples

4. **Proportions**: Stacked bars, treemaps, waffle charts

5. **Ordering**: Alphabetical, by value, by time, by logic

---
# Ordering Categories Effectively



``` r
library(palmerpenguins)

# Alphabetical (default)
p1 &lt;- penguins %&gt;% 
  drop_na(species) %&gt;% 
  count(species) %&gt;% 
  ggplot(aes(x = species, y = n)) +
  geom_col(fill = "#25B6EE") +
  labs(title = "Alphabetical ordering")
p1
```

# Ordering by Value


``` r
# Ordered by count
p2 &lt;- penguins %&gt;%

# Cleveland Dot Plots

Great alternative to bar charts when you have many categories


``` r
mpg %&gt;% 
  group_by(manufacturer) %&gt;% 
  summarize(mean_hwy = mean(hwy)) %&gt;% 
  mutate(manufacturer = fct_reorder(manufacturer, mean_hwy)) %&gt;% 
  ggplot(aes(x = mean_hwy, y = manufacturer)) +
  geom_point(size = 4, color = "#0072B2") +
  labs(x = "Mean Highway MPG",
       y = NULL,
       title = "Average Fuel Efficiency by Manufacturer")
```

# Lollipop Charts

Add visual connection to baseline


``` r
mpg %&gt;% 
  group_by(manufacturer) %&gt;% 
  summarize(mean_hwy = mean(hwy)) %&gt;% 
  mutate(manufacturer = fct_reorder(manufacturer, mean_hwy)) %&gt;% 
  ggplot(aes(x = mean_hwy, y = manufacturer)) +
  geom_segment(aes(x = 0, xend = mean_hwy,

  labs(x = "Mean Highway MPG",

# Small Multiples: Time Series


``` r
library(gapminder)

gapminder %&gt;% 
  filter(country %in% c("United States", "China", "India", 
                        "Germany", "Brazil", "Nigeria")) %&gt;% 
  ggplot(aes(x = year, y = gdpPercap)) +
  geom_line(color = "#0072B2", size = 1) +

  facet_wrap(~ country, scales = "free_y") +
  scale_y_continuous(labels = scales::dollar) +
  labs(x = "Year",
       y = "GDP per Capita",
       title = "Economic Growth Across Countries")+

# Small Multiples: Better Layout

``` r
# First, identify top 4 countries per continent in 2007
top_countries &lt;- gapminder %&gt;% 
  filter(year == 2007) %&gt;% 
  group_by(continent) %&gt;% 
  slice_max(gdpPercap, n = 4) %&gt;% 
  pull(country)

# Then filter gapminder to just those countries across all years
gapminder %&gt;% 
  filter(country %in% top_countries) %&gt;% 
  mutate(country = fct_reorder(country, gdpPercap, .fun = max)) %&gt;% 
  ggplot(aes(x = year, y = gdpPercap)) +
  geom_line(color = "#0072B2", size = 1) +
  geom_point(size = 2, color = "#0072B2") +
  facet_wrap(~ country, scales = "free_y", ncol = 4) +
  scale_y_continuous(labels = scales::dollar) +
  labs(x = "Year",
       y = "GDP per Capita",
       title = "Top 4 Countries by GDP per Capita in Each Continent (2007)")
```

# Changing aspect ratio
* Explore how your plot will look in its final size

* No hard/fast rules (if on different scales)

* Not even really rules of thumb

* Keep visual perception in mind

* Try your best to be truthful - show the trend/relation, but don't
exaggerate/hide it

# Color Scales for Comparing Categories

---
# Choosing Colors for Categories

Key principles:
* **Distinct**: Colors should be easily distinguishable
* **Accessible**: Consider colorblindness (8% of males, 0.5% of females)
* **Meaningful**: Colors can carry meaning (red = danger, green = success)
* **Limited**: Use 3-7 colors maximum for discrete categories

---

Please follow along with code

# Why annotate?

* Direct labels often better than legends
* Highlight important features
* Provide context
* Tell the story in your data
* Guide the reader's attention

---
# Reference lines


``` r
mpg %&gt;% 
  group_by(class) %&gt;% 
  summarize(mean_hwy = mean(hwy)) %&gt;% 
  mutate(class = fct_reorder(class, mean_hwy)) %&gt;% 
  ggplot(aes(x = mean_hwy, y = class)) +
  geom_col(fill = "#25B6EE") +
  geom_vline(xintercept = mean(mpg$hwy), 
             linetype = "dashed", 
             color = "red", 
             size = 1) +
  labs(x = "Mean Highway MPG",
       y = NULL,
       title = "Fuel Efficiency by Vehicle Class",
       subtitle = "Red line shows overall average")

# Theme Element Functions

Four main functions for theme elements:

* `element_text()`: Text elements (axis labels, titles, etc.)
* `element_line()`: Line elements (axis lines, grid lines)
* `element_rect()`: Rectangle elements (plot background, panel background)
* `element_blank()`: Remove element completely

# Creating Your Own Theme


``` r
theme_maithreyi &lt;- function(base_size = 14) {
  theme_minimal(base_size = base_size) +
  theme(
    # Text elements scaled relative to base_size
    plot.title = element_text(
      size = base_size * 1.3, 
      face = "bold", 
      color = "#2c3e50",
      hjust = 0
    ),
    
    plot.subtitle = element_text(
      size = base_size * 0.9, 
      face = "italic", 
      color = "gray40",
      hjust = 0
    ),
    
    axis.title = element_text(
      size = base_size * 1.0, 
      face = "bold"
    ),
    
    axis.text = element_text(
      size = base_size * 0.8
    ),
    
    # Grid - minimal but present
    panel.grid.minor = element_blank(),
    panel.grid.major = element_line(
      color = "gray85", 
      size = 0.3
    ),
    
    # Background
    plot.background = element_rect(
      fill = "white", 
      color = NA
    ),
    
    panel.background = element_rect(
      fill = "gray98", 
      color = NA
    ),
    
    # Legend
    legend.position = "top",
    legend.title = element_text(
      size = base_size * 0.9, 
      face = "bold"
    ),
    legend.text = element_text(
      size = base_size * 0.8
    ),
    
    # Caption
    plot.caption = element_text(
      size = base_size * 0.7, 
      color = "gray50", 
      hjust = 0
    )
  )
}
```

# Best Practices: Comparing Categories

1. **Order thoughtfully**: By value, time, or logic (not alphabetically)
2. **Use appropriate chart type**: Bars for counts, dots for many categories
3. **Consider faceting**: For multiple grouping variables
4. **Highlight what matters**: Use color strategically
5. **Annotate directly**: Labels often better than legends
6. **Maintain consistency**: Same colors across related charts

# Last Quick example
The *google_trends* dataset comes from a [fivethirtyeight story](https://fivethirtyeight.com/features/the-media-really-started-paying-attention-to-puerto-rico-when-trump-did/) about how the media covered hurricanes and Trump.


``` r
library(fivethirtyeight)
g &lt;- google_trends %&gt;% 
  pivot_longer(starts_with("hurricane"), 
               names_to = "hurricane", 
               values_to = "interest",
               names_pattern = "_(.+)_")

landfall &lt;- tibble(
  date = lubridate::mdy(
    c("August 25, 2017", "September 10, 2017", "September 20, 2017")
  ),
  hurricane = c("Harvey Landfall", "Irma Landfall", "Maria Landfall")
)
```

---
Let's start by visualizing the change in trends for each hurricane over time in one plot with three scales. We can map color to a discrete scale here. We can add vertical lines to show when each of them made landfall!


``` r
p &lt;- ggplot(g, aes(date, interest)) +
  geom_ribbon(aes(fill = hurricane, ymin = 0, ymax = interest),
              alpha = 0.6) + 
  geom_vline(aes(xintercept = date), landfall,
             color = "gray80", 
             lty = "dashed") +
  geom_text(aes(x = date, y = 80, label = hurricane), landfall,
            color = "gray80",
            nudge_x = 0.5, 
            hjust = 0) +
  labs(x = "", 
       y = "Google Trends",
       title = "Hurricane Google trends over time",
       caption = "Source: https://github.com/fivethirtyeight/data/tree/master/puerto-rico-media") + 
  scale_fill_brewer("Hurricane", palette = "Set2")
```

# Saving Plots

---
# The ggsave() function

Basic usage:


``` r
p &lt;- ggplot(mpg, aes(x = displ, y = hwy)) +
  geom_point()

ggsave("my_plot.png", p, width = 8, height = 6, dpi = 300)
```

---
# Common ggsave() arguments

* `filename`: Path and filename (extension determines format)
* `plot`: Plot object (defaults to last plot)
* `width`, `height`: Dimensions in `units`
* `units`: "in" (default), "cm", or "mm"
* `dpi`: Resolution (300 for print, 96 for screen)
* `device`: File type ("png", "pdf", "jpeg", "tiff", etc.)

---
# Different file formats


``` r
# PNG for web/presentations
ggsave("figure1.png", width = 8, height = 6, dpi = 300)

# PDF for publications (vector, scalable)
ggsave("figure1.pdf", width = 8, height = 6)

# JPEG (smaller file size, lossy compression)
ggsave("figure1.jpg", width = 8, height = 6, dpi = 300)

# TIFF for publications (lossless)
ggsave("figure1.tiff", width = 8, height = 6, dpi = 300)

# SVG (vector, for web)
ggsave("figure1.svg", width = 8, height = 6)
```

---
# Aspect ratios for different uses


``` r
# Widescreen presentation (16:9)
ggsave("presentation.png", width = 10, height = 5.625, dpi = 150)

# Square for Instagram
ggsave("instagram.png", width = 6, height = 6, dpi = 300)

# Journal figure (often 3.5" or 7" wide)
ggsave("journal.pdf", width = 7, height = 5)

# Poster (large format)
ggsave("poster.pdf", width = 24, height = 36, dpi = 300)
```

---
# Setting defaults


``` r
# Create custom save function
save_plot &lt;- function(filename, plot = last_plot()) {
  ggsave(
    filename = filename,
    plot = plot,
    width = 8,
    height = 6,
    dpi = 300,
    bg = "white"  # Ensures white background
  )
}

# Use it
p &lt;- ggplot(mpg, aes(x = displ, y = hwy)) + geom_point()
save_plot("my_figure.png", p)
```

# Saving plots for publication


``` r
# High resolution, multiple formats
p &lt;- ggplot(mpg, aes(x = displ, y = hwy)) +
  geom_point() +
  theme_minimal(base_size = 12)

# For manuscript
ggsave("figure1_main.pdf", p, width = 7, height = 5)
ggsave("figure1_main.png", p, width = 7, height = 5, dpi = 600)

# For supplement (might be different size)
ggsave("figureS1.pdf", p, width = 8.5, height = 11)

# The preview trick


``` r
# From TJ Mahr - preview exact output size
ggpreview &lt;- function(..., device = "png") {
  fname &lt;- tempfile(fileext = paste0(".", device))
  ggsave(filename = fname, device = device, ...)
  system2("open", fname)  # Mac
  # Use shell.exec(fname) on Windows
  invisible(NULL)
}

# Preview at exact journal dimensions
ggpreview(width = 3.5, height = 3.5, dpi = 300)
```
